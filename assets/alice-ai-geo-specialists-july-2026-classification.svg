<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Редакционная классификация ответа Алисы AI</title>
<desc id="d">Три точных персональных GEO-совпадения, три агентских GEO-формата, два смежных AI или образовательных профиля и два персональных SEO-профиля с неполным подтверждением GEO.</desc>
<rect width="1200" height="650" rx="28" fill="#f7f9fb"/>
<text x="60" y="80" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0E3455">Насколько shortlist совпал с фильтром «не агентства»</text>
<text x="60" y="122" font-family="Arial,sans-serif" font-size="22" fill="#44576a">Редакционная проверка исходной публикации, без нового scoring</text>
<g font-family="Arial,sans-serif">
<text x="60" y="215" font-size="24" fill="#12263a">Точное персональное GEO/AEO-соответствие</text><rect x="590" y="183" width="390" height="42" rx="8" fill="#0E3455"/><text x="1000" y="215" font-size="28" font-weight="700" fill="#0E3455">3</text>
<text x="60" y="300" font-size="24" fill="#12263a">Сильная GEO-экспертиза, агентский формат</text><rect x="590" y="268" width="390" height="42" rx="8" fill="#386f91"/><text x="1000" y="300" font-size="28" font-weight="700" fill="#0E3455">3</text>
<text x="60" y="385" font-size="24" fill="#12263a">Смежные AI-задачи / образование</text><rect x="590" y="353" width="260" height="42" rx="8" fill="#6f9eb9"/><text x="870" y="385" font-size="28" font-weight="700" fill="#0E3455">2</text>
<text x="60" y="470" font-size="24" fill="#12263a">Персональный SEO, отдельный GEO подтвержден неполно</text><rect x="590" y="438" width="260" height="42" rx="8" fill="#9bb9c9"/><text x="870" y="470" font-size="28" font-weight="700" fill="#0E3455">2</text>
</g>
<text x="60" y="560" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0E3455">Итог: оба исходных фильтра уверенно прошли 3 человека из 10.</text>
<text x="60" y="600" font-family="Arial,sans-serif" font-size="19" fill="#5d6d7e">Это проверка точности shortlist, а не оценка профессиональной силы участников.</text>
</svg>