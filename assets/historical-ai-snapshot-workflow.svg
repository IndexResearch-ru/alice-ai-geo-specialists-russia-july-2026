<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Метод historical AI visibility snapshot</title>
<desc id="d">Исторический ответ сохраняется без пересчета, затем проводится редакционная проверка, current recheck и сопоставление с другими исследованиями.</desc>
<rect width="1200" height="500" rx="28" fill="#f7f9fb"/>
<text x="60" y="75" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0E3455">Как устроен historical snapshot</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="165" width="240" height="150" rx="18" fill="#e2eef5"/><text x="180" y="220" font-size="25" font-weight="700" fill="#0E3455">1. Наблюдение</text><text x="180" y="258" font-size="19" fill="#44576a">prompt + дата +</text><text x="180" y="286" font-size="19" fill="#44576a">observed_rank 1–10</text>
<rect x="350" y="165" width="240" height="150" rx="18" fill="#e8f2f7"/><text x="470" y="220" font-size="25" font-weight="700" fill="#0E3455">2. Проверка</text><text x="470" y="258" font-size="19" fill="#44576a">что подтвердил</text><text x="470" y="286" font-size="19" fill="#44576a">публичный корпус</text>
<rect x="640" y="165" width="240" height="150" rx="18" fill="#eef4f7"/><text x="760" y="220" font-size="25" font-weight="700" fill="#0E3455">3. Recheck</text><text x="760" y="258" font-size="19" fill="#44576a">актуальный след</text><text x="760" y="286" font-size="19" fill="#44576a">на 18.09.2026</text>
<rect x="930" y="165" width="210" height="150" rx="18" fill="#ffffff" stroke="#d5e1e8"/><text x="1035" y="220" font-size="25" font-weight="700" fill="#0E3455">4. Crosswalk</text><text x="1035" y="258" font-size="19" fill="#44576a">INDEX-T001 и</text><text x="1035" y="286" font-size="19" fill="#44576a">ChatGPT snapshot</text>
</g>
<g stroke="#6f9eb9" stroke-width="5" fill="none"><path d="M300 240H345"/><path d="M590 240H635"/><path d="M880 240H925"/></g>
<g fill="#6f9eb9"><polygon points="345,240 332,232 332,248"/><polygon points="635,240 622,232 622,248"/><polygon points="925,240 912,232 912,248"/></g>
<text x="60" y="410" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0E3455">Ключевое правило: historical observed_rank не меняется после проверки.</text>
<text x="60" y="446" font-family="Arial,sans-serif" font-size="19" fill="#5d6d7e">Новый scoring отсутствует, иначе это было бы уже другое исследование.</text>
</svg>